name: 09 - Using Functions

on: 
    pull_request:
    workflow_dispatch:
jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: Print PR title
              run: |
                echo "PR Title: ${{ github.event.pull_request.title }}"
            - name: Print PR label
              run: |
                echo "PR label: ${{ toJson(github.event.pull_request.labels) }}"
            - name: print gituhub event
              run: |
                echo "${{ toJson(github.event.pull_request) }}"
            - name: Sleep for 20 seconds
              run: sleep 20
            - name: Failing step
              run: exit 0
            - name: I will be skipped
              if: ${{ success() }}
              run:  "I will print if previous steps succeed."
            - name: I will execute
              if: ${{ failure() }}
              run: "I will print if any previous step fails."
            - name: I will execute
              if: ${{ !cancelled() }}
              run: "I will always print, except when the workflow is cancelled."
            - name: I will execute when cancelled
              if: ${{ cancelled() }}
              run: "I will always print, when the workflow is cancelled."
 