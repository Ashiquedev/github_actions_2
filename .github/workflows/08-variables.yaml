name: 08 - Using Variables
#run-name: 06 - Contexts | DEBUG - ${{ inputs.debug }}
on:
    
    workflow_dispatch:  
    
env:
  WORKFLOW_VAR: 'I am a workflow env var'
  OVERWRITTEN: 'I will be overwritten'
jobs:
    echo:
      runs-on: ubuntu-latest
      env:
        JOB_VAR: 'I am a job env var'
        OVERWRITTEN: 'I have been overwritten at the job level'        
      steps:
      - name: Print Env Variables
        env: 
          STEP_VAR: 'I am a step env var'
          STEP_VAR_2: 'I am another step var'
        run: |
          echo '"Step env var: ${{ env.STEP_VAR }} "'
          echo '"Step env var 2: ${{ env.STEP_VAR_2 }}"'  
          echo 'Job env var: ${{ env.JOB_VAR }}' 
          echo 'Workflow env var: ${{ env.WORKFLOW_VAR }}'
          echo 'Overwritten: ${{ env.OVERWRITTEN }}'
          # result:
          # "Step env var: I am a step env var "
          # "Step env var 2: I am another step var"
          # Job env var: I am a job env var
          # Workflow env var: I am a workflow env var
          # Overwritten: I have been overwritten at the job level
      - name: Print Env Variables by $MY_VARIABLE
        env: 
          STEP_VAR: 'I am a step env var'
          STEP_VAR_2: 'I am another step var'
        run: |
          echo "Step env var: $STEP_VAR"
          echo "Job env var: $JOB_VAR" 
          echo "Workflow env var: $WORKFLOW_VAR"
          echo "Overwritten: $OVERWRITTEN"
          
      - name: Overwrite Job Variable
        env: 
          OVERWRITTEN: 'I have been overwritten at the step level' 
        run: |
          echo 'step overwritten env var: ${{ env.OVERWRITTEN }}'
          echo "Shell Context: $OVERWRITTEN"
    windows:
      runs-on: windows-latest
      steps:
        - name: Print Env Variables (Windows PowerShell)
          env: 
            STEP_VAR: 'I am a step env var'
          run: |
            # In PowerShell, you MUST use $env:
            echo "Step env var: $env:STEP_VAR"
            echo "Job env var: $env:JOB_VAR"
            echo "Workflow env var: $env:WORKFLOW_VAR"
    echo2:
      runs-on: ubuntu-latest
      steps:
        - name: Print Variables
          run: |
            #echo "Org var: ${{ vars.ORG_VAR }}"
            # echo "Org overwritten var: ${{ vars.OVERWRITTEN_VAR }}"
            echo "Repo var: ${{ vars.REPOSITORY_VAR }}"
    echo-prod:
      runs-on: ubuntu-latest
      environment: prod   ##### as we created envirnments and their values we refer those as like this
      steps: 
        - name: Print Prod Variables
          run: | 
            #echo "Org var: ${{ vars.ORG_VAR }}"
            echo "Org overwritten var: ${{ vars.OVERWRITTEN_VAR }}"
            echo "Repo var: ${{ vars.REPOSITORY_VAR }}"
            echo "Environment var: ${{ vars.TARGET_VAR }}"    
    echo-stage:
      runs-on: ubuntu-latest
      environment: stage
      steps: 
        - name: Print Prod Variables
          run: | 
            # echo "Org var: ${{ vars.ORG_VAR }}"
            echo " overwritten var: ${{ vars.OVERWRITTEN_VAR }}"
            echo "Repo var: ${{ vars.REPOSITORY_VAR }}"
            echo "Environment var: ${{ vars.TARGET_VAR }}"  


#Why "GitHub Interpolation" is safer
#The ${{ env.VAR_NAME }} syntax is universal. It works exactly the same on Ubuntu, Windows, and macOS because GitHub replaces that text before the shell even starts.
#
#Summary of what to use:
#Use ${{ env.VAR }} if you want your workflow to work on any OS without changing the code.
#
#Use $VAR only if you are 100% sure you are using runs-on: ubuntu-latest.
#
#Use $env:VAR only if you are 100% sure you are using runs-on: windows-latest.