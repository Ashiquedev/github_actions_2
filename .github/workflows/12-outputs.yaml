# 1. define step id for the steps that produces outputs

# 2. syntax:  echo "key=value" >> $GITHUB_OUTPUT"

# 3. mention the outputs in the outputs section of the job: => reference in job.outputs:  staps.stepid.outputs.key
# 4 list the jb as depencency that need the output
# 5. access the output via the needs context: => echo ${{ needs.job1_name.outputs.key }}



name: 12 - Working with Outputs

on:
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        options:
          - success
          - failure
        default: success
      build-status2:
        type: choice
        options:
          - success
          - failure
        default: success

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outputs.status }}
      build-status2: ${{ steps.build2.outputs.status }}
      output1: ${{ steps.build.outputs.output1 }}
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: |
          echo "$GITHUB_OUTPUT"  # it will generate sha of the file at the end of the path
          echo "status=${{ inputs.build-status }}" >> "$GITHUB_OUTPUT"
          echo "output1=value1" >> "$GITHUB_OUTPUT"
          echo "output2=value2" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"  ### shows key value pairs of the all the above
     
      - name: Step with mistake
        run: |
          echo "mistake=true" > "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Build2
        id: build2
        run: |
          echo "$GITHUB_OUTPUT"  # it will generate sha of the file at the end of the path
          echo "status=${{ inputs.build-status2 }}" >> "$GITHUB_OUTPUT"
          echo "output1=value1" >> "$GITHUB_OUTPUT"
          echo "output2=value2" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"  ### shows key value pairs of all the bove values
          echo "mistake=true" > "$GITHUB_OUTPUT" # over write all the values of this stepoutput
          cat "$GITHUB_OUTPUT"  ### shows key value pair of mistake only
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.build-status == 'success' }}
    steps:
      - name: Deploy
        run: echo "Deploying"
      - name: Print Outputs
        run: |
          echo "Output 1: ${{ needs.build.outputs.output1 }}"


# In GitHub Actions, when working with output variables, it’s crucial to understand how to manage the contents of the outputs file. This file stores key-value pairs generated in one job that can be used in subsequent jobs.

#Here are the main points regarding overwriting GitHub output variables:
#
#Appending vs. Overwriting: When you use the command echo "key = value" >> $GITHUB_OUTPUT, it appends the new key-value pair to the outputs file, preserving any previously set outputs. In contrast, using a single > results in overwriting the entire contents of the outputs file. This will cause any previously set outputs to be lost.
#
#Proper Usage: To avoid losing data, always use the double greater-than sign (>>) when adding output variables. If you mistakenly use the single greater-than sign (>), it will overwrite everything in the file.
#
#Accessing Outputs: After setting the outputs correctly, you can access them in later steps of your job. They are referenced using the specific syntax for accessing outputs from other steps.
#
#Job Reference: It’s essential to provide an ID for the steps that output data to correctly reference those outputs in your workflow.