name: 03 - runners
on: 
  workflow_dispatch:
jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        run: |
            echo "This job is running on an Ubuntu runner. ${{runner.os}}"
            echo "This job is running on an Ubuntu runner. $RUNNER_OS "
  windows-echo:
    runs-on: windows-latest
    steps:
        - name: Show OS
          run: |
            echo "This job is running on an windows runner. ${{runner.os}}"
            Write-Output "This job is running on an windows runner. ${{runner.os}}"
            echo "This job is running on an Ubuntu runner. $RUNNER_OS "
  macos-echo:
    runs-on: macos-latest
    steps:
        - name: Show OS
          run: |
             echo "This job is running on an macos runner. ${{runner.os}}"
             echo "This job is running on an Ubuntu runner. $RUNNER_OS "