name: exp - Using Expressions
on:
  pull_request:
    types: [opened]
  push:
    branches:
      - expressions
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: 'Enable debug logging'
        default: true

        
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Print start-up data
        # Using github.event.inputs to ensure it catches manual triggers correctly
        if: ${{ github.event.inputs.debug == 'true' || inputs.debug == true }}
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"

      - name: Print when triggered from expressions branch
        if: ${{ (github.event.inputs.debug == 'true' || inputs.debug == true) && github.ref_name == 'expressions' }}
        run: |
          echo "I was triggered from expressions"

      - name: print
        run: echo "hello, world!"